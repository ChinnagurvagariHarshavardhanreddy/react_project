<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Katana Web</title>
  <style>
    :root {
      --bg: #070707;
      --surface: #101114;
      --text: #f6f7f9;
      --muted: #b8bcc6;
      --accent: #c1121f;
      --line: rgba(255, 255, 255, 0.2);
      --glow: rgba(193, 18, 31, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", "Inter", system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 15% 20%, #141414 0%, var(--bg) 58%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .katana-mark {
      position: fixed;
      top: 1.1rem;
      right: 1.1rem;
      opacity: 0.22;
      transform: rotate(22deg);
      pointer-events: none;
    }

    .katana-mark svg {
      width: 110px;
      height: 110px;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.1));
    }

    header,
    footer {
      width: min(1050px, 92vw);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header {
      padding: 1.5rem 0 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .brand svg {
      width: 22px;
      height: 22px;
      fill: var(--accent);
    }

    .slash-line {
      width: min(1050px, 92vw);
      height: 1px;
      margin: 0 auto;
      background: linear-gradient(
        90deg,
        transparent 0%,
        var(--line) 20%,
        rgba(255, 255, 255, 0.68) 50%,
        var(--line) 80%,
        transparent 100%
      );
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.16);
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 2.5rem 1rem;
    }

    .hero-card {
      width: min(760px, 94vw);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: clamp(1.8rem, 4vw, 3.2rem);
      text-align: center;
      box-shadow:
        0 20px 42px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(3px);
    }

    h1 {
      font-size: clamp(1.9rem, 4vw, 3rem);
      letter-spacing: 0.4px;
      font-weight: 800;
      transform: translateY(-20px);
      opacity: 0;
      animation: titleDrop 900ms cubic-bezier(0.25, 0.8, 0.2, 1) forwards;
    }

    .description {
      margin: 1rem auto 0;
      max-width: 60ch;
      color: var(--muted);
      line-height: 1.7;
      font-weight: 300;
      font-size: 1.03rem;
    }

    .cta {
      margin-top: 2rem;
      padding: 0.85rem 1.6rem;
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(193, 18, 31, 0.28), rgba(193, 18, 31, 0.08));
      color: var(--text);
      font-weight: 600;
      letter-spacing: 0.4px;
      cursor: pointer;
      transition: transform 220ms ease, box-shadow 220ms ease, border-color 220ms ease;
    }

    .cta:hover,
    .cta:focus-visible {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 0 0 3px rgba(193, 18, 31, 0.15), 0 0 18px var(--glow);
      border-color: #ff4a56;
      outline: none;
    }

    .cta:active {
      transform: translateY(0) scale(0.99);
    }

    footer {
      padding: 1rem 0 1.6rem;
      color: var(--muted);
      font-size: 0.92rem;
      gap: 0.7rem;
      flex-wrap: wrap;
    }

    .github {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 200ms ease, border-color 200ms ease, text-shadow 200ms ease;
    }

    .github:hover,
    .github:focus-visible {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.8);
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
      outline: none;
    }

    @keyframes titleDrop {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @media (max-width: 600px) {
      .hero-card {
        text-align: left;
      }

      .description {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <div class="katana-mark" aria-hidden="true">
    <svg viewBox="0 0 160 160" role="img">
      <rect x="20" y="72" width="96" height="3" rx="1.5" fill="white" />
      <rect x="112" y="67" width="8" height="13" rx="1" fill="#c1121f" />
      <rect x="120" y="70" width="20" height="7" rx="2" fill="white" />
      <rect x="140" y="66" width="5" height="15" rx="2" fill="#c1121f" />
    </svg>
  </div>

  <header>
    <div class="brand" aria-label="Katana Web brand">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2 11.8 14.3 6l1.3 2.6L5.4 14zM15.7 8.4l2.6 1.3L17 12.4l-2.6-1.3zM17.8 12.9l1.9.9c.7.4 1 1.3.6 2l-1.7 3.3c-.4.7-1.3 1-2 .6l-1.9-.9z"/>
      </svg>
      <span>Katana Web</span>
    </div>
  </header>

  <div class="slash-line" aria-hidden="true"></div>

  <main>
    <section class="hero-card" aria-labelledby="hero-title">
      <h1 id="hero-title">Sharp Tools for the Modern Web</h1>
      <p class="description">
        Build fast with clean, minimal interfaces designed for precision. Katana Web delivers focused tools
        that cut through clutter and keep your workflow sharp.
      </p>
      <button class="cta" type="button" aria-label="Get Started">Get Started</button>
    </section>
  </main>

  <footer>
    <p>© 2026 Katana Web. All rights reserved.</p>
    <a class="github" href="#" aria-label="GitHub link placeholder">GitHub</a>
  </footer>

  <script>
    document.querySelector('.cta').addEventListener('click', () => {
      const btn = document.querySelector('.cta');
      btn.animate([
        { boxShadow: '0 0 0 0 rgba(193, 18, 31, 0.0)' },
        { boxShadow: '0 0 20px 6px rgba(193, 18, 31, 0.45)' },
        { boxShadow: '0 0 0 0 rgba(193, 18, 31, 0.0)' }
      ], {
        duration: 600,
        easing: 'ease-out'
      });
    });
  </script>
</body>
</html>
